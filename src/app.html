<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#000000" />
		<meta name="color-scheme" content="dark light" />
		<meta name="description" content="Pair two devices and send an ephemeral secret." />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="XChan" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/xchan-icon.svg" type="image/svg+xml" />
		<link rel="icon" href="/xchan-icon-192.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<title>XChan</title>
		%sveltekit.head%
		<script>
			(function () {
				try {
					var t = localStorage.getItem('xchan-theme');
					if (t !== 'light' && t !== 'dark') t = 'dark';
					document.documentElement.dataset.theme = t;
					document.documentElement.style.colorScheme = t;
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', t === 'light' ? '#F8F8F8' : '#000000');
				} catch (e) {
					document.documentElement.dataset.theme = 'dark';
				}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
